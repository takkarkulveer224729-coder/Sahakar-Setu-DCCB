<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coop Connect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <div id="login" class="login hidden">
    <div class="login-card">
      <div class="login-logo">💬</div>
      <h1>Coop Connect</h1>
      <p class="muted">Chat and share files with your co-op, from anywhere.</p>
      <div class="tabs" role="tablist">
        <button type="button" id="tab-login" class="tab active" role="tab">Log in</button>
        <button type="button" id="tab-register" class="tab" role="tab">Create account</button>
      </div>

      <form id="login-form">
        <label>Username
          <input id="login-username" placeholder="e.g. asha.patil" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label>Password
          <input id="login-pass" type="password" placeholder="Your password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn-primary">Log in</button>
        <div class="error" data-error></div>
        <p class="muted small">New here? <a href="#" data-switch="register">Create an account</a></p>
      </form>

      <form id="register-form" class="hidden">
        <label>Full name
          <input id="reg-name" placeholder="e.g. Asha Patil" maxlength="32" autocomplete="name" required>
        </label>
        <label>Username
          <input id="reg-username" placeholder="3–20 letters, numbers, . or _" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[A-Za-z0-9._]{3,20}" required>
        </label>
        <label>Password
          <input id="reg-pass" type="password" placeholder="At least 6 characters" minlength="6" autocomplete="new-password" required>
        </label>
        <label>Confirm password
          <input id="reg-pass2" type="password" placeholder="Type it again" minlength="6" autocomplete="new-password" required>
        </label>
        <button type="submit" class="btn-primary">Create account</button>
        <div class="error" data-error></div>
        <p class="muted small">Already have an account? <a href="#" data-switch="login">Log in</a></p>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <header class="side-header">
        <div id="my-avatar" class="avatar" title="Profile"></div>
        <div class="side-actions">
          <button id="btn-new-group" class="icon-btn" title="New group">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          </button>
          <button id="btn-new-chat" class="icon-btn" title="New chat">
            <svg viewBox="0 0 24 24"><path d="M19.005 3.175H4.674C3.642 3.175 3 3.789 3 4.821V21.02l3.544-3.514h12.461c1.033 0 2.064-1.06 2.064-2.093V4.821c-.001-1.032-1.032-1.646-2.064-1.646zm-4.989 9.869H7.041V11.1h6.975v1.944zm3-4H7.041V7.1h9.975v1.944z"/></svg>
          </button>
          <button id="btn-logout" class="icon-btn" title="Log out">
            <svg viewBox="0 0 24 24"><path d="M10.09 15.59 11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5a2 2 0 0 0-2 2v4h2V5h14v14H5v-4H3v4a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          </button>
        </div>
      </header>
      <div class="search-wrap">
        <input id="search" placeholder="Search or start new chat">
      </div>
      <div id="chat-list" class="chat-list"></div>

      <!-- Slide-in panel: new chat / new group / profile -->
      <section id="panel" class="panel">
        <header class="panel-header">
          <button id="panel-back" class="icon-btn" title="Back">
            <svg viewBox="0 0 24 24"><path d="M12 4l1.4 1.4L7.8 11H20v2H7.8l5.6 5.6L12 20l-8-8 8-8z"/></svg>
          </button>
          <h2 id="panel-title">New chat</h2>
        </header>
        <div id="panel-body" class="panel-body"></div>
      </section>
    </aside>

    <main id="main" class="main">
      <div id="welcome" class="welcome">
        <div class="welcome-art">💬</div>
        <h1>Coop Connect</h1>
        <p class="muted">Send and receive messages, photos, videos and documents.<br>Pick a chat on the left or start a new one.</p>
      </div>

      <div id="conversation" class="conversation hidden">
        <header class="conv-header">
          <button id="conv-back" class="icon-btn mobile-only" title="Back">
            <svg viewBox="0 0 24 24"><path d="M12 4l1.4 1.4L7.8 11H20v2H7.8l5.6 5.6L12 20l-8-8 8-8z"/></svg>
          </button>
          <div id="conv-avatar" class="avatar"></div>
          <div class="conv-info">
            <div id="conv-name" class="conv-name"></div>
            <div id="conv-status" class="conv-status"></div>
          </div>
          <button id="btn-video-call" class="icon-btn hidden" title="Video call">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          </button>
          <button id="btn-voice-call" class="icon-btn hidden" title="Voice call">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          </button>
          <button id="btn-chat-menu" class="icon-btn" title="Menu">
            <svg viewBox="0 0 24 24"><path d="M12 7a2 2 0 1 0-.001-4.001A2 2 0 0 0 12 7zm0 2a2 2 0 1 0-.001 3.999A2 2 0 0 0 12 9zm0 6a2 2 0 1 0-.001 3.999A2 2 0 0 0 12 15z"/></svg>
          </button>
        </header>

        <div id="messages" class="messages"></div>

        <div id="drop-overlay" class="drop-overlay hidden">Drop files to send</div>

        <div id="reply-bar" class="reply-bar hidden">
          <div class="reply-preview">
            <div id="reply-name" class="reply-name"></div>
            <div id="reply-text" class="reply-text"></div>
          </div>
          <button id="reply-cancel" class="icon-btn" title="Cancel reply">✕</button>
        </div>

        <div id="upload-progress" class="upload-progress hidden"><div></div></div>

        <footer class="composer">
          <div id="emoji-picker" class="emoji-picker hidden"></div>
          <button id="btn-emoji" class="icon-btn" title="Emoji">
            <svg viewBox="0 0 24 24"><path d="M9.153 11.603c.795 0 1.439-.879 1.439-1.962s-.644-1.962-1.439-1.962-1.439.879-1.439 1.962.644 1.962 1.439 1.962zm-3.204 1.362c-.026-.307-.131 5.218 6.063 5.551 6.066-.25 6.066-5.551 6.066-5.551-6.078 1.416-12.129 0-12.129 0zm11.363 1.108s-.669 1.959-5.051 1.959c-3.505 0-5.388-1.164-5.607-1.959 0 0 5.912 1.055 10.658 0zM11.804 1.011C5.609 1.011.978 6.033.978 12.228s4.826 10.761 11.021 10.761S23.02 18.423 23.02 12.228c.001-6.195-5.021-11.217-11.216-11.217zM12 21.354c-5.273 0-9.381-3.886-9.381-9.159s3.942-9.548 9.215-9.548 9.548 4.275 9.548 9.548c-.001 5.272-4.109 9.159-9.382 9.159zm3.108-9.751c.795 0 1.439-.879 1.439-1.962s-.644-1.962-1.439-1.962-1.439.879-1.439 1.962.644 1.962 1.439 1.962z"/></svg>
          </button>
          <button id="btn-attach" class="icon-btn" title="Attach files">
            <svg viewBox="0 0 24 24"><path d="M1.816 15.556v.002c0 1.502.584 2.912 1.646 3.972s2.472 1.647 3.974 1.647a5.58 5.58 0 0 0 3.972-1.645l9.547-9.548c.769-.768 1.147-1.767 1.058-2.817-.079-.968-.548-1.927-1.319-2.698-1.594-1.592-4.068-1.711-5.517-.262l-7.916 7.915c-.881.881-.792 2.25.214 3.261.959.958 2.423 1.053 3.263.215l5.511-5.512c.28-.28.267-.722.053-.936l-.244-.244c-.191-.191-.567-.349-.957.04l-5.506 5.506c-.18.18-.635.127-.976-.214-.098-.097-.576-.613-.213-.973l7.915-7.917c.818-.817 2.267-.699 3.23.262.5.501.802 1.1.849 1.685.051.573-.156 1.111-.589 1.543l-9.547 9.549a3.97 3.97 0 0 1-2.829 1.171 3.975 3.975 0 0 1-2.83-1.173 3.973 3.973 0 0 1-1.172-2.828c0-1.071.415-2.076 1.172-2.83l7.209-7.211c.157-.157.264-.579.028-.814L11.5 4.36a.572.572 0 0 0-.834.018l-7.205 7.207a5.577 5.577 0 0 0-1.645 3.971z"/></svg>
          </button>
          <input id="file-input" type="file" multiple hidden>
          <textarea id="msg-input" rows="1" placeholder="Type a message"></textarea>
          <button id="btn-send" class="icon-btn send" title="Send">
            <svg viewBox="0 0 24 24"><path d="M1.101 21.757 23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"/></svg>
          </button>
        </footer>
      </div>
    </main>
  </div>

  <!-- Image / video viewer -->
  <div id="viewer" class="viewer hidden">
    <button id="viewer-close" class="viewer-close" title="Close">✕</button>
    <a id="viewer-download" class="viewer-download" title="Download">⬇</a>
    <div id="viewer-content"></div>
  </div>

  <!-- Voice / video call screen -->
  <div id="call" class="call hidden">
    <video id="call-remote" class="call-remote" autoplay playsinline></video>
    <div id="call-face" class="call-face">
      <div id="call-avatar" class="avatar xl"></div>
    </div>
    <div class="call-top">
      <div id="call-kind" class="call-kind"></div>
      <div id="call-name" class="call-name"></div>
      <div id="call-status" class="call-status"></div>
    </div>
    <video id="call-local" class="call-local hidden" autoplay playsinline muted></video>
    <div id="call-controls" class="call-controls">
      <button id="call-camera" class="call-btn" title="Turn camera off">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      </button>
      <button id="call-mute" class="call-btn" title="Mute microphone">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
      <button id="call-hangup" class="call-btn end" title="End call">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      </button>
    </div>
    <div id="call-incoming" class="call-controls hidden">
      <button id="call-decline" class="call-btn end" title="Decline">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      </button>
      <button id="call-accept" class="call-btn accept" title="Accept">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Confirmation dialog -->
  <div id="dialog" class="dialog-backdrop hidden">
    <div class="dialog" role="dialog" aria-modal="true">
      <div id="dialog-title" class="dialog-title"></div>
      <div id="dialog-text" class="dialog-text"></div>
      <div id="dialog-buttons" class="dialog-buttons"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
